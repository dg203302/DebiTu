<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0e12">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.json">

    <title>Iniciando | DebiTú</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Sistema de Diseño Neo-Fintech Dark & Volt -->
    <link rel="stylesheet" href="/Estilos/branding_renovado.css">
</head>

<body>
    <div class="app-viewport">
        <main class="splash-container" role="status" aria-live="polite" aria-busy="true">
            <div class="splash-logo-box">
                <img src="/icons/Icon.png" alt="DebiTú Logo" loading="eager" decoding="async">
            </div>

            <div>
                <h1 class="splash-title">
                    Debi<span>Tú</span>
                </h1>
                <p id="loading-status" class="splash-status-text">Verificando sesión...</p>
            </div>

            <!-- Neo-Fintech Spinner -->
            <div class="loader-spinner" style="width: 32px; height: 32px; border-width: 3px; border-color: rgba(204, 255, 0, 0.2); border-top-color: var(--brand-volt);"></div>
        </main>
    </div>

    <!-- Script de Verificación y Enrutamiento Renovado -->
    <script type="module">
        import { loadSupaBseWithAuth } from '/Scripts/supabase.js';

        const statusEl = document.getElementById('loading-status');
        const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg; };

        (async () => {
            const isDesktop = window.innerWidth >= 1024;
            const targetDashboard = isDesktop 
                ? '/Plantillas_Renovadas_Desktop/Dashboard_renov_desktop.html' 
                : '/Plantillas_Renovadas/Dashboard_renov.html';
            const targetLogin = isDesktop 
                ? '/Plantillas_Renovadas_Desktop/Login_renov_desktop.html' 
                : '/Plantillas_Renovadas/Login_renov.html';

            try {
                setStatus('Conectando con el sistema…');
                const clientesup = await loadSupaBseWithAuth();

                setStatus('Verificando credenciales…');
                const idUsuario = localStorage.getItem('UserID');
                
                // Si ya existe un ID de usuario guardado y válido, redirigir al Dashboard correspondiente
                if (idUsuario && idUsuario !== 'N/A') {
                    window.location.href = targetDashboard;
                    return;
                }

                // Verificar la sesión activa en Supabase Auth
                const { data: { session }, error } = await clientesup.auth.getSession();
                if (error) {
                    console.warn('Error al verificar sesión:', error);
                    window.location.href = targetLogin;
                    return;
                }

                if (session && session.user) {
                    localStorage.setItem('UserID', session.user.id);

                    const meta = session.user.user_metadata || {};
                    const identity0 = Array.isArray(session.user.identities)
                        ? session.user.identities[0]?.identity_data
                        : null;

                    const userName = (meta.full_name || meta.name || meta.user_name || meta.username || session.user.email || '').toString().trim();
                    if (userName) localStorage.setItem('UserName', userName);

                    const userPhoto = (meta.avatar_url || meta.picture || identity0?.avatar_url || identity0?.picture || '').toString().trim();
                    if (userPhoto) localStorage.setItem('UserPhoto', userPhoto);

                    const userEmail = (session.user.email || meta.email || '').toString().trim();
                    if (userEmail) localStorage.setItem('UserEmail', userEmail);

                    setStatus('Iniciando panel principal…');
                    window.location.href = targetDashboard;
                    return;
                }

                // Si no hay sesión activa, ir al login correspondiente
                window.location.href = targetLogin;

            } catch (e) {
                console.error('Error durante la verificación inicial:', e);
                window.location.href = targetLogin;
            }
        })();
    </script>
</body>

</html>
